[package]
name = "pactum"
version = "2.0.0"
edition = "2021"
description = "Pactum: sovereign agent enclaves, bonded natural-language treaties, TEE-signed multi-model adjudication on NEAR."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" exposes env::ecrecover, used to verify NEAR AI Cloud TEE signatures (EIP-191 / secp256k1).
near-sdk = { version = "=5.30.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
